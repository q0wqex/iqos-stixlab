<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>STIX — Вкусы HEETS & FIIT</title>
  <meta name="description" content="Минималистичный сервис для оценки и выбора лучших вкусов стиков HEETS и FIIT.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0c">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-top">
        <h1 class="logo">STIX <span class="logo-sub">LAB</span></h1>
        <div class="partner-chips">
          <span class="chip chip-u1">🧔 Андрей</span>
          <span class="chip-heart">❤️</span>
          <span class="chip chip-u2">👩 Катя</span>
        </div>
      </div>

      <!-- Search Input -->
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск вкуса (Green zing, Viola, яблоко, ментол)..." autocomplete="off">
        <button id="clearSearch" class="btn-clear" style="display: none;">✕</button>
      </div>

      <!-- Collection Filters -->
      <nav class="nav-filters">
        <button class="filter-btn active" data-filter="ALL">Все (<span id="countAll">0</span>)</button>
        <button class="filter-btn" data-filter="HEETS">HEETS (<span id="countHeets">0</span>)</button>
        <button class="filter-btn" data-filter="FIIT">FIIT (<span id="countFiit">0</span>)</button>
        <button class="filter-btn filter-top" data-filter="TOP">🏆 Лучшие (<span id="countTop">0</span>)</button>
      </nav>
    </header>

    <!-- Main Stick List -->
    <main class="sticks-list" id="sticksList">
      <!-- Generated by app.js -->
    </main>

    <!-- Rating Quick Sheet Modal -->
    <div class="modal-backdrop" id="rateModal" style="display: none;">
      <div class="modal-sheet">
        <div class="sheet-handle"></div>
        <button class="modal-close" id="closeRateModal" aria-label="Закрыть">✕</button>

        <div class="sheet-stick-header">
          <span class="sheet-brand-badge" id="modalBrand">HEETS</span>
          <h2 class="sheet-stick-title" id="modalName">Green Zing</h2>
          <p class="sheet-stick-desc" id="modalDesc"></p>
        </div>

        <div class="quick-rater-box">
          <!-- Andrey Rating -->
          <div class="user-rate-row u1-row">
            <div class="user-rate-info">
              <span class="user-rate-avatar">🧔</span>
              <span class="user-rate-name">Андрей:</span>
              <span class="user-rate-score" id="u1ScoreDisplay">5</span>
            </div>
            <div class="stars-picker" id="u1Stars">
              <button type="button" class="star-btn" data-score="1">1</button>
              <button type="button" class="star-btn" data-score="2">2</button>
              <button type="button" class="star-btn" data-score="3">3</button>
              <button type="button" class="star-btn" data-score="4">4</button>
              <button type="button" class="star-btn" data-score="5">5</button>
            </div>
          </div>

          <!-- Katya Rating -->
          <div class="user-rate-row u2-row">
            <div class="user-rate-info">
              <span class="user-rate-avatar">👩</span>
              <span class="user-rate-name">Катя:</span>
              <span class="user-rate-score" id="u2ScoreDisplay">5</span>
            </div>
            <div class="stars-picker" id="u2Stars">
              <button type="button" class="star-btn" data-score="1">1</button>
              <button type="button" class="star-btn" data-score="2">2</button>
              <button type="button" class="star-btn" data-score="3">3</button>
              <button type="button" class="star-btn" data-score="4">4</button>
              <button type="button" class="star-btn" data-score="5">5</button>
            </div>
          </div>
        </div>

        <!-- Mutual Average & Save -->
        <div class="sheet-footer">
          <div class="mutual-score-badge">
            <span class="mutual-score-label">Средний балл:</span>
            <span class="mutual-score-num" id="modalMutualScore">5.0</span>
          </div>
          <button class="btn-save" id="btnSaveRating">Сохранить ✨</button>
        </div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
